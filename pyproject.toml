[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensiguard"
version = "1.0.0"
description = "A Multimodal Machine-Learning Framework for Detecting, Attributing and Explaining Anti-Forensic Manipulation of Digital Evidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohika Rathi", email = "mohika.rathi@student.manipal.edu" },
    { name = "Sreyaan Roy", email = "sreyaan.roy@student.manipal.edu" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "shap>=0.44.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "reportlab>=4.0.0",
    "puremagic>=1.15",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0"
]

[project.scripts]
forensiguard = "forensiguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
